name: Bug report
description: Report a reproducible problem with Aywa on Windows
title: "[Bug]: "
labels:
  - bug
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find the same problem.
          required: true
        - label: I am using Aywa on Windows.
          required: true
  - type: input
    id: aywa-version
    attributes:
      label: Aywa version or commit
      description: Enter the release version or source commit hash.
      placeholder: 0.1.0 or abc1234
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - GitHub release installer
        - Built from source
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: List the shortest reliable sequence that causes the problem.
      placeholder: |
        1. Open Aywa...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the exact visible error message.
    validations:
      required: true
  - type: textarea
    id: diagnosis
    attributes:
      label: Debug diagnosis
      description: Copy System tools, Acceleration, Runtime, and Model from Aywa's Debug tab.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I reviewed the diagnosis and any attached log and removed information I do not want to publish.
          required: true
  - type: markdown
    attributes:
      value: |
        ### Debug log (optional)
        Drag the reviewed/redacted `aywa-debug.log` file into the additional context box below. Do not paste a large log inline. See the [support guide](https://github.com/firasjaber/stt/blob/master/docs/SUPPORT.md).
  - type: textarea
    id: context
    attributes:
      label: Log attachment and additional context
      description: Attach the reviewed log, screenshots, or other useful context. The log is optional.
