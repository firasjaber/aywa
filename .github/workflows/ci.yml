name: Windows CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  validate:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Verify release policy
        run: npm run verify:release-policy
      - name: Check frontend
        run: npm run check
      - name: Build frontend
        run: npm run build
      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Test Python protocol
        run: python -m pytest src-tauri/python/tests -v
