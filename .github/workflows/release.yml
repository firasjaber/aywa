name: Unsigned Windows Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Python test dependency
        run: python -m pip install --disable-pip-version-check --requirement src-tauri/python/requirements-test.txt
      - name: Prepare embedded Python resources
        run: npm run prepare:python-runtime
      - name: Verify release tag
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/verify-release-policy.mjs --tag "$env:RELEASE_TAG"
      - name: Run checks and tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run check
          npm run build
          cargo test --manifest-path src-tauri/Cargo.toml --locked
          python -m pytest src-tauri/python/tests -v
      - name: Build Windows installer
        run: npm run tauri -- build --bundles nsis
      - name: Create checksums and smoke-install the unsigned installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          $installer = Get-ChildItem 'src-tauri\target\release\bundle\nsis' -Filter '*.exe' -File
          if ($installer.Count -ne 1) { throw "Expected one NSIS installer, found $($installer.Count)." }
          Copy-Item -LiteralPath $installer.FullName -Destination release-assets
          Get-ChildItem release-assets -File -Filter '*.exe' |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "{0} *{1}" -f $_.Hash.ToLowerInvariant(), $_.Name } |
            Set-Content -NoNewline release-assets\SHA256SUMS.txt
          $releaseInstaller = Get-ChildItem release-assets -File -Filter '*.exe'
          Start-Process -FilePath $releaseInstaller.FullName -ArgumentList '/S' -Wait
          $installedExecutable = Join-Path $env:LOCALAPPDATA 'Aywa\Aywa.exe'
          if (!(Test-Path -LiteralPath $installedExecutable)) { throw "Smoke install did not create $installedExecutable." }
          $uninstaller = Join-Path $env:LOCALAPPDATA 'Aywa\uninstall.exe'
          if (Test-Path -LiteralPath $uninstaller) { Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait }
      - name: Upload verified release assets
        uses: actions/upload-artifact@v4
        with:
          name: aywa-${{ github.ref_name }}-windows
          path: release-assets
          if-no-files-found: error
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Aywa ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/*.exe
            release-assets/SHA256SUMS.txt
